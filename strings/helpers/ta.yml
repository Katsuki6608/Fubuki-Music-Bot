  <b>{1} [பயனர்பெயர் அல்லது பயனர் ID] - சுடோ பட்டியலிலிருந்து நீக்கவும்</b>
  <b>{2} - அனைத்து சுடோ பயனர்களின் பட்டியலைப் பெறவும்</b>

  <b><u>சேவையகம் / சூழல் மாறிகள் (Env Vars):</u></b>

  <b>{3}</b> - சர்வர் வளங்களின் பயன்பாடு (Resource Usage)
  <b>{4} [மாறி பெயர்]</b> - ஒரு config மாறியின் மதிப்பைப் பெறவும்
  <b>{5} [மாறி பெயர்]</b> - ஒரு மாறியை நீக்கவும்
  <b>{6} [மாறி பெயர்] [மதிப்பு]</b> - ஒரு மாறியைச் சேர்க்கவும் அல்லது புதுப்பிக்கவும். பெயரையும் மதிப்பையும் இடைவெளி விட்டு உள்ளிடவும்

  <b><u>பாட் கட்டளைகள்:</u></b>

  <b>{7}</b> - பாட்டை மறுதொடக்கம் செய்யவும் (SUDOERS மட்டும்)
  <b>{8}</b> - பாட்டைப் புதுப்பிக்கவும் (Update)
  <b>{9}</b> - சேவையகத்தின் இணைய வேகத்தைச் சரிபார்க்கவும்
  <b>{10} [enable / disable]</b> - பாட்டின் பராமரிப்பு முறையை மாற்றவும் (Maintenance mode)
  <b>{11} [enable / disable]</b> - லாக் குழுவிற்கு வினவல்களைப் பதிவுசெய்வதை மாற்றவும்
  <b>{12} [வரிகளின் எண்ணிக்கை]</b> - சேவையகத்திலிருந்து பதிவுகளைப் (Logs) பெறவும்
  <b>{13} [enable / disable]</b> - வாய்ஸ் சேட்டில் யாரும் பாடல் கேட்கவில்லை எனில் 30 வினாடிகளுக்குப் பிறகு ஸ்ட்ரீமைத் தானாகவே நிறுத்தவும்
