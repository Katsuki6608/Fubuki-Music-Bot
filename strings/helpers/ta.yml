G-cast: |
  <b>{0} [செய்தி அல்லது செய்திக்கு பதிலளிக்கவும்]</b> » பாட் இணைக்கப்பட்டுள்ள அனைத்து குழுக்களுக்கும் செய்தியை ஒளிபரப்பவும் (Broadcast)
  <u>ஒளிபரப்பு முறைகள்:</u>

  <b><code>-pin</code></b> » குழுக்களில் உங்கள் செய்தியைப் பின் (Pin) செய்யும்

  <b><code>-pinloud</code></b> » குழுக்களில் செய்தியைப் பின் செய்து அனைத்து உறுப்பினர்களுக்கும் அறிவிப்பை அனுப்பும்

  <b><code>-user</code></b> » பாட்டை ஸ்டார்ட் செய்த அனைத்துப் பயனர்களுக்கும் தனிப்பட்ட முறையில் அனுப்பும் [நீங்கள் `-pin` அல்லது `-pinloud` சேர்க்கலாம்]

  <b><code>-assistant</code></b> » பாட்டின் அனைத்து உதவி கணக்குகள் (Assistants) வழியாகவும் செய்தியை அனுப்பும்

  <b><code>-nobot</code></b> » பிரதான **பாட்** கணக்கிலிருந்து செய்தி செல்வதைத் தடுக்கும் [குழுக்களுக்கு அனுப்ப விரும்பாதபோது பயனுள்ளது]

  > <b>உதாரணம்:</b> <code>/{0} -user -assistant -pin சோதனை ஒளிபரப்பு</code>


